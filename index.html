<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariana & Javier</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f1e8;
      color: #6f5433;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.9), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(255,255,255,.7), transparent 28%),
        #f7f1e8;
    }

    .card {
      width: min(100%, 520px);
      text-align: center;
      animation: fadeIn 1.2s ease both;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(30px, 8vw, 48px);
      font-weight: 400;
      font-style: italic;
    }

    .heart {
      margin: 12px auto 24px;
      font-size: 24px;
    }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 1.55 / 1;
      margin: 0 auto;
      background: #eee3d2;
      border-radius: 5px;
      box-shadow: 0 18px 45px rgba(91, 67, 38, .20);
      border: 1px solid rgba(164, 126, 72, .35);
      overflow: visible;
    }

    .flap {
      position: absolute;
      inset: 0 0 auto 0;
      height: 55%;
      background: #f4eadb;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top: 1px solid rgba(164,126,72,.35);
      transform-origin: top center;
      transition: transform 1s cubic-bezier(.22,.8,.25,1);
      z-index: 3;
    }

    .wax {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 92px;
      height: 92px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #b58b4b;
      color: #fff8eb;
      font-size: 26px;
      font-weight: bold;
      box-shadow: 0 8px 16px rgba(80,55,25,.25);
      border: 5px solid #d1ae72;
      z-index: 4;
      transition: opacity .45s ease, transform .7s ease;
    }

    .open .flap {
      transform: rotateX(180deg);
    }

    .open .wax {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.65);
    }

    .instruction {
      margin: 26px 0 18px;
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    button {
      border: 1px solid #b58b4b;
      background: #f8f0e4;
      color: #6f5433;
      padding: 17px 30px;
      border-radius: 14px;
      font: inherit;
      font-size: 16px;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(91,67,38,.12);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    button:active {
      transform: scale(.97);
    }

    .invite {
      display: none;
      min-height: 100vh;
      padding: 60px 22px;
      text-align: center;
      animation: fadeIn 1s ease both;
    }

    .invite.show {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .invite h2 {
      font-size: clamp(38px, 10vw, 64px);
      font-weight: 400;
      margin: 10px 0;
    }

    .invite p {
      font-size: 18px;
      line-height: 1.7;
      max-width: 420px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <main class="screen" id="opening">
    <section class="card">
      <div class="eyebrow">Tenemos una invitación</div>
      <h1>especial para ti</h1>
      <div class="heart">♡</div>

      <div class="envelope" id="envelope">
        <div class="flap"></div>
        <div class="wax">M&amp;J</div>
      </div>

      <div class="instruction">Toca para abrir</div>

      <button id="openButton">ABRIR INVITACIÓN</button>
    </section>
  </main>

  <section class="invite" id="invite">
    <div class="eyebrow">Nuestra historia comienza aquí</div>
    <h2>Mariana &amp; Javier</h2>
    <p>
      Estamos felices de compartir contigo uno de los días
      más especiales de nuestras vidas.
    </p>
    <p>10 · 10 · 2026</p>
  </section>

  <!-- Música de prueba.
       Más adelante sustituiremos esta URL por el archivo de música de la invitación. -->
  <audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const button = document.getElementById("openButton");
    const envelope = document.getElementById("envelope");
    const opening = document.getElementById("opening");
    const invite = document.getElementById("invite");
    const music = document.getElementById("music");

    button.addEventListener("click", async () => {
      envelope.classList.add("open");

      // El audio se intenta iniciar justo después del toque del usuario.
      try {
        await music.play();
      } catch (error) {
        console.log("La música necesita un archivo music.mp3 válido.");
      }

      setTimeout(() => {
        opening.style.display = "none";
        invite.classList.add("show");
        window.scrollTo(0, 0);
      }, 850);
    });
  </script>

</body>
</html>
