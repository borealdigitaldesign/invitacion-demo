<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Emily & James</title>

<style>

/* =========================================
   GENERAL
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    background:#f4e8df;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    overflow:hidden;

    font-family:Georgia,
        "Times New Roman",
        serif;

}


/* =========================================
   INVITATION STAGE
========================================= */

.stage{

    position:relative;

    width:min(
        100vw,
        70.64vh
    );

    aspect-ratio:
        1054 / 1492;

    overflow:hidden;

}


/* =========================================
   BASE IMAGE
========================================= */

.base{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    z-index:1;

}


/* =========================================
   INTERIOR INVITATION CARD
========================================= */

.invitation-card{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    z-index:2;

}


/* =========================================
   ENVELOPE BODY
========================================= */

.envelope-body{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    z-index:3;

}


/* =========================================
   ENVELOPE FLAP
========================================= */

.envelope-flap{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    z-index:5;

    transform-origin:
        50% 28.2%;

    transform:
        rotateX(0deg);

    transition:
        transform 1.2s
        cubic-bezier(
            .4,
            0,
            .2,
            1
        );

}


/* =========================================
   WAX SEAL
========================================= */

.seal{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    object-fit:contain;

    z-index:10;

    cursor:pointer;

    transition:

        opacity .5s ease,

        transform .6s ease;

}


/* =========================================
   LITTLE PULSE ON SEAL
========================================= */

.seal{

    animation:
        sealPulse 2.2s
        ease-in-out
        infinite;

}


@keyframes sealPulse{

    0%,
    100%{

        transform:
            scale(1);

    }

    50%{

        transform:
            scale(1.025);

    }

}


/* =========================================
   OPENING ANIMATION
========================================= */

.opening .envelope-flap{

    transform:
        rotateX(180deg);

}


.opening .seal{

    opacity:0;

    transform:
        scale(1.18);

    pointer-events:none;

    animation:none;

}


/* =========================================
   OPEN INVITATION BUTTON
========================================= */

.invitation-button{

    position:absolute;

    left:8%;

    width:84%;

    /* SUBIDO APROX. 1 CM */

    bottom:20%;

    z-index:20;

    display:flex;

    justify-content:center;

    align-items:center;

    opacity:0;

    transform:
        translateY(20px);

    pointer-events:none;

    transition:

        opacity .7s ease .8s,

        transform .7s ease .8s;

}


.opening .invitation-button{

    opacity:1;

    transform:
        translateY(0);

    pointer-events:auto;

}


/* =========================================
   BUTTON
========================================= */

.invitation-button button{

    width:100%;

    max-width:470px;

    min-height:42px;

    padding:
        10px
        18px;

    border-radius:30px;

    border:
        1px solid
        #bd8b7c;

    background:
        rgba(
            255,
            250,
            246,
            .94
        );

    color:#68483a;

    font-family:Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(
            10px,
            1.7vw,
            16px
        );

    letter-spacing:
        2px;

    cursor:pointer;

    box-shadow:
        0 6px 15px
        rgba(
            80,
            50,
            40,
            .12
        );

    transition:

        transform .2s ease,

        background .2s ease,

        box-shadow .2s ease;

}


.invitation-button button:hover{

    transform:
        translateY(-2px);

    background:
        #fffaf7;

    box-shadow:
        0 9px 20px
        rgba(
            80,
            50,
            40,
            .18
        );

}


.invitation-button button:active{

    transform:
        scale(.98);

}


/* =========================================
   MOBILE
========================================= */

@media(
    max-width:600px
){

    body{

        align-items:center;

    }

    .stage{

        width:
            min(
                100vw,
                70.64vh
            );

    }

    .invitation-button{

        bottom:7.5%;

    }

    .invitation-button button{

        min-height:39px;

        padding:
            8px
            12px;

        letter-spacing:
            1.5px;

    }

}


/* =========================================
   VERY SHORT SCREENS
========================================= */

@media(
    max-height:650px
){

    .stage{

        width:
            min(
                100vw,
                70.64vh
            );

    }

}

</style>

</head>


<body>


<div class="stage">


    <!-- =================================
         INVITATION BACKGROUND
    ================================== -->

    <img
        class="base"
        src="emily_james_base_for_animation.png"
        alt="Emily and James wedding invitation">


    <!-- =================================
         INTERIOR INVITATION CARD
    ================================== -->

    <img
        class="invitation-card"
        src="emily_james_invitation_card.png"
        alt="Emily and James wedding invitation">


    <!-- =================================
         ENVELOPE BODY
    ================================== -->

    <img
        class="envelope-body"
        src="emily_james_envelope_body.png"
        alt="">


    <!-- =================================
         ENVELOPE FLAP
    ================================== -->

    <img
        class="envelope-flap"
        src="emily_james_flap_animation.png"
        alt="">


    <!-- =================================
         WAX SEAL
    ================================== -->

    <img
        class="seal"
        id="seal"
        src="emily_james_seal_animation.png"
        alt="Open invitation"
        onclick="openEnvelope()">


    <!-- =================================
         OPEN INVITATION BUTTON
    ================================== -->

    <div
        class="invitation-button"
        id="invitationButton">

        <button
            onclick="openInvitation()">

            OPEN OUR INVITATION

        </button>

    </div>


</div>


<!-- =====================================
     MUSIC
====================================== -->

<audio
    id="music"
    src="musica.mp3.mp3"
    loop>
</audio>


<script>


/* =====================================
   ELEMENTS
====================================== */

const stage =
    document.querySelector(".stage");

const seal =
    document.getElementById("seal");

const music =
    document.getElementById("music");


/* =====================================
   OPEN ENVELOPE
====================================== */

function openEnvelope(){

    stage.classList.add("opening");

}


/* =====================================
   OPEN INVITATION
====================================== */

function openInvitation(){

    /*
       Music starts because the guest
       clicked the button.
    */

    music.play().catch(() => {

        // If the browser blocks the music,
        // the invitation still opens.

    });


    /*
       Open the Canva invitation.
    */

    window.open(

        "https://boreal-digital-design.my.canva.site/premium-custom",

        "_blank"

    );

}


</script>


</body>

</html>
