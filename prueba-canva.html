<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Emily & James | Test</title>


<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


html,
body{

    width:100%;
    height:100%;

}


body{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:#f7eee7;

    color:#68483a;

    overflow:hidden;

}


/* =========================
   FONDO
========================= */

.cover{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

        radial-gradient(
            circle at 15% 15%,
            #ead2c6 0,
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 85%,
            #e5c4b6 0,
            transparent 30%
        ),

        #f7eee7;

}


/* =========================
   SOBRE
========================= */

.envelope{

    width:340px;

    height:230px;

    position:relative;

    background:#eadbd0;

    border-radius:5px;

    box-shadow:

        0 25px 50px
        rgba(80,50,40,.20);

}


/* =========================
   PAPEL INTERIOR
========================= */

.envelope-paper{

    position:absolute;

    width:80%;

    height:190px;

    left:10%;

    top:20px;

    background:#fffaf6;

    text-align:center;

    padding-top:55px;

    z-index:2;

    transition:
        transform 1.2s ease;

}


.paper-names{

    font-size:25px;

    font-style:italic;

    color:#68483a;

}


.paper-names span{

    color:#bd756b;

}


.paper-date{

    margin-top:15px;

    font-size:9px;

    letter-spacing:3px;

    color:#8c6b5c;

}


/* =========================
   FRENTE DEL SOBRE
========================= */

.envelope-front{

    position:absolute;

    inset:0;

    background:#eadbd0;

    clip-path:

        polygon(
            0 0,
            50% 52%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index:4;

}


/* =========================
   SOLAPA
========================= */

.envelope-flap{

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:125px;

    background:#dfcabe;

    clip-path:

        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:top;

    z-index:6;

    transition:

        transform 1s ease;

}


/* =========================
   SELLO DE CERA
========================= */

.wax-seal{

    position:absolute;

    width:74px;

    height:74px;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    border:none;

    border-radius:50%;

    background:#9a554d;

    color:#f8e9df;

    font-family:Georgia,serif;

    font-size:18px;

    font-weight:bold;

    z-index:10;

    cursor:pointer;

    box-shadow:

        0 8px 18px
        rgba(70,40,35,.30),

        inset 0 0 0 4px
        rgba(255,255,255,.12);

    animation:

        sealPulse 2s
        ease-in-out
        infinite;

}


.wax-seal span{

    font-size:12px;

}


/* =========================
   TEXTO TAP
========================= */

.tap{

    position:fixed;

    top:calc(50% + 145px);

    left:0;

    width:100%;

    text-align:center;

    font-size:10px;

    letter-spacing:4px;

    color:#795b4d;

    transition:.5s;

}


/* =========================
   OPCIONES DE MÚSICA
========================= */

.music-choice{

    position:absolute;

    left:50%;

    top:calc(100% + 25px);

    transform:
        translateX(-50%);

    width:320px;

    text-align:center;

    display:none;

    z-index:20;

}


.music-choice p{

    font-size:10px;

    letter-spacing:3px;

    margin-bottom:15px;

    color:#795b4d;

}


.music-choice button{

    display:block;

    width:100%;

    margin:8px 0;

    padding:12px 18px;

    border:1px solid #c99979;

    border-radius:30px;

    background:#fffaf6;

    color:#68483a;

    font-family:Georgia,serif;

    font-size:11px;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:

        0 6px 15px
        rgba(80,50,40,.10);

    transition:.3s;

}


.music-choice button:hover{

    transform:
        translateY(-2px);

    background:#f8eee6;

}


/* =========================
   ANIMACIÓN DEL SELLO
========================= */

@keyframes sealPulse{

    0%,100%{

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    50%{

        transform:
            translate(-50%,-50%)
            scale(1.06);

    }

}


/* =========================
   ANIMACIÓN ABRIR SOBRE
========================= */

.opening .envelope-flap{

    transform:
        rotateX(180deg);

}


.opening .envelope-paper{

    transform:
        translateY(-115px);

}


.opening .wax-seal{

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(1.5);

    transition:.5s;

}


.opening .tap{

    opacity:0;

}


</style>

</head>



<body>


<!-- =========================
     SOBRE
========================= -->

<div
    class="cover"
    id="cover">


    <div
        class="envelope"
        id="envelope">


        <!-- PAPEL INTERIOR -->

        <div class="envelope-paper">

            <div class="paper-names">

                Emily
                <span>&</span>
                James

            </div>


            <div class="paper-date">

                NOVEMBER 28 • 2026

            </div>

        </div>


        <!-- FRENTE -->

        <div class="envelope-front"></div>


        <!-- SOLAPA -->

        <div class="envelope-flap"></div>


        <!-- SELLO -->

        <button
            class="wax-seal"
            id="seal"
            onclick="openEnvelope()">

            E
            <span>&</span>
            J

        </button>


        <!-- OPCIONES -->

        <div
            class="music-choice"
            id="musicChoice">


            <p>
                HOW WOULD YOU LIKE TO ENTER?
            </p>


            <button
                onclick="enterWithMusic()">

                🎵 ENTER WITH MUSIC

            </button>


            <button
                onclick="enterWithoutMusic()">

                ♡ ENTER WITHOUT MUSIC

            </button>


        </div>


    </div>


    <!-- TEXTO -->

    <div
        class="tap"
        id="tap">

        TAP THE SEAL TO OPEN

    </div>


</div>



<!-- =========================
     MÚSICA
========================= -->

<audio
    id="music"
    src="./musica.mp3.mp3"
    loop>

</audio>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   URL DE CANVA
========================= */

const canvaURL =
    "https://boreal-digital-design.my.canva.site/premium-custom";


/* =========================
   ELEMENTOS
========================= */

const envelope =
    document.getElementById("envelope");

const musicChoice =
    document.getElementById("musicChoice");

const music =
    document.getElementById("music");


/* =========================
   ABRIR SOBRE
========================= */

function openEnvelope(){

    /* Animación */

    envelope.classList.add("opening");


    /* Mostrar opciones */

    setTimeout(() => {

        musicChoice.style.display =
            "block";

    }, 700);

}


/* =========================
   ENTRAR CON MÚSICA
========================= */

function enterWithMusic(){

    /*
       El clic del usuario permite
       iniciar la música.
    */

    music.play().then(() => {

        console.log(
            "Música iniciada."
        );

    }).catch((error) => {

        console.log(
            "No se pudo iniciar la música.",
            error
        );

    });


    /*
       Abrimos Canva en una
       NUEVA PESTAÑA.

       Así esta página permanece
       abierta y la música continúa.
    */

    window.open(
        canvaURL,
        "_blank"
    );

}


/* =========================
   ENTRAR SIN MÚSICA
========================= */

function enterWithoutMusic(){

    window.open(
        canvaURL,
        "_blank"
    );

}


</script>


</body>

</html>
