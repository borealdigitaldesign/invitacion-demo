<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Emily & James | Test</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Georgia, "Times New Roman", serif;
    background:#f7eee7;
    color:#68483a;
}


/* =========================
   SOBRE
========================= */

.cover{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 15% 15%,
            #ead2c6 0,
            transparent 28%
        ),

        radial-gradient(
            circle at 85% 85%,
            #e5c4b6 0,
            transparent 30%
        ),

        #f7eee7;

}


.envelope{

    width:340px;
    height:230px;

    position:relative;

    background:#eadbd0;

    box-shadow:
        0 25px 50px
        rgba(80,50,40,.20);

    border-radius:5px;

}


/* papel */

.envelope-paper{

    position:absolute;

    width:80%;
    height:190px;

    left:10%;
    top:20px;

    background:#fffaf6;

    text-align:center;

    padding-top:55px;

    z-index:2;

    transition:
        transform 1.2s ease;

}


.paper-names{

    font-size:25px;

    font-style:italic;

    color:#68483a;

}


.paper-names span{

    color:#bd756b;

}


.paper-date{

    margin-top:15px;

    font-size:9px;

    letter-spacing:3px;

    color:#8c6b5c;

}


/* frente */

.envelope-front{

    position:absolute;

    inset:0;

    background:#eadbd0;

    clip-path:
        polygon(
            0 0,
            50% 52%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index:4;

}


/* solapa */

.envelope-flap{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:125px;

    background:#dfcabe;

    clip-path:
        polygon(
            0 0,
            100% 0,
            50% 100%
        );

    transform-origin:top;

    z-index:6;

    transition:
        transform 1s ease;

}


/* =========================
   SELLO
========================= */

.wax-seal{

    position:absolute;

    width:74px;
    height:74px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border:none;

    border-radius:50%;

    background:#9a554d;

    color:#f8e9df;

    font-family:Georgia,serif;

    font-size:18px;

    font-weight:bold;

    z-index:10;

    cursor:pointer;

    box-shadow:
        0 8px 18px
        rgba(70,40,35,.30),

        inset 0 0 0 4px
        rgba(255,255,255,.12);

    animation:
        sealPulse 2s
        ease-in-out
        infinite;

}


.wax-seal span{

    font-size:12px;

}


/* =========================
   TEXTO
========================= */

.tap{

    position:fixed;

    top:calc(50% + 145px);

    width:100%;

    text-align:center;

    font-size:10px;

    letter-spacing:4px;

    color:#795b4d;

}


/* =========================
   ANIMACIONES
========================= */

@keyframes sealPulse{

    0%,100%{

        transform:
            translate(-50%,-50%)
            scale(1);

    }

    50%{

        transform:
            translate(-50%,-50%)
            scale(1.06);

    }

}


.opening .envelope-flap{

    transform:
        rotateX(180deg);

}


.opening .envelope-paper{

    transform:
        translateY(-115px);

}


.opening .wax-seal{

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(1.5);

    transition:.5s;

}


.opening .tap{

    opacity:0;

}


</style>

</head>


<body>


<!-- SOBRE -->

<div class="cover" id="cover">

    <div
        class="envelope"
        id="envelope">


        <div class="envelope-paper">

            <div class="paper-names">

                Emily
                <span>&</span>
                James

            </div>


            <div class="paper-date">

                NOVEMBER 28 • 2026

            </div>

        </div>


        <div class="envelope-front"></div>


        <div class="envelope-flap"></div>


        <button
            class="wax-seal"
            onclick="openCanva()">

            E
            <span>&</span>
            J

        </button>


    </div>


    <div class="tap">

        TAP THE SEAL TO OPEN

    </div>

</div>


<!-- MÚSICA -->

<audio
    id="music"
    src="./musica.mp3.mp3"
    loop>
</audio>


<script>

function openCanva(){

   <script>

const music =
    document.getElementById("music");

const envelope =
    document.getElementById("envelope");


/* =========================
   INTENTAR MÚSICA AL CARGAR
========================= */

window.addEventListener("load", () => {

    music.play().then(() => {

        console.log("La música comenzó automáticamente.");

    }).catch(() => {

        console.log(
            "El navegador bloqueó el autoplay."
        );

    });

});


/* =========================
   CLIC EN EL SOBRE
========================= */

function openCanva(){

    /* Intentar iniciar música
       por si el navegador
       bloqueó el autoplay */

    music.play().catch(() => {

        console.log(
            "El navegador bloqueó la música."
        );

    });


    /* Abrir sobre */

    envelope.classList.add("opening");


    /* Ir a Canva */

    setTimeout(() => {

        window.location.href =
            "https://boreal-digital-design.my.canva.site/premium-custom";

    }, 1400);

}

</script>
</body>

</html>
